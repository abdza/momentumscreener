<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Hour Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<!-- hammer must load before the zoom plugin: it's what gives the plugin
     drag-to-pan and pinch-to-zoom (wheel zoom works without it) -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d1117;
  color: #c9d1d9;
  font-family: 'Segoe UI', system-ui, monospace;
  font-size: 13px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

h1 { font-size: 15px; color: #58a6ff; white-space: nowrap; }

.controls {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-left: auto;
  flex-wrap: wrap;
}

.mode-toggle {
  display: flex;
  border: 1px solid #30363d;
  border-radius: 6px;
  overflow: hidden;
}

.mode-btn {
  background: #21262d;
  border: none;
  color: #8b949e;
  padding: 5px 12px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.1s;
}

.mode-btn.active {
  background: #1f6feb;
  color: #fff;
}

.zoom-btn {
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #8b949e;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
}
.zoom-btn:hover { border-color: #58a6ff; color: #58a6ff; }

label { font-size: 12px; color: #8b949e; }

select, input[type=number] {
  background: #21262d;
  border: 1px solid #30363d;
  color: #c9d1d9;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 12px;
}

input[type=number] { width: 54px; text-align: center; }

.main {
  display: grid;
  grid-template-columns: 1fr 270px;
  flex: 1;
  overflow: hidden;
}

.chart-area {
  position: relative;
  padding: 14px 14px 10px;
  min-width: 0;
}

canvas { width: 100% !important; }

.status {
  position: absolute;
  bottom: 12px;
  right: 18px;
  font-size: 11px;
  color: #6e7681;
  display: flex;
  align-items: center;
  gap: 5px;
}

.live-dot {
  width: 6px; height: 6px;
  background: #3fb950;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.sidebar {
  border-left: 1px solid #30363d;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-head {
  padding: 7px 14px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: #6e7681;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.sort-select {
  background: #0d1117;
  border: 1px solid #30363d;
  color: #c9d1d9;
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  cursor: pointer;
  text-transform: none;
  letter-spacing: 0;
  margin-left: auto;
}

.show-all-btn {
  background: #0d1117;
  border: 1px solid #30363d;
  color: #c9d1d9;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  cursor: pointer;
  text-transform: none;
  letter-spacing: 0;
}
.show-all-btn:hover { border-color: #58a6ff; color: #58a6ff; }

.ticker-list {
  overflow-y: auto;
  flex: 1;
}

.ticker-list::-webkit-scrollbar { width: 4px; }
.ticker-list::-webkit-scrollbar-track { background: transparent; }
.ticker-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

.ticker-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-bottom: 1px solid #161b22;
  cursor: pointer;
  transition: background 0.1s;
}

.ticker-row:hover { background: #161b22; }
.ticker-row.muted { opacity: 0.35; }

.solo-btn {
  flex-shrink: 0;
  width: 18px; height: 18px;
  border: 1px solid #30363d;
  border-radius: 3px;
  background: #0d1117;
  color: #6e7681;
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.1s, border-color 0.1s, color 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ticker-row:hover .solo-btn { opacity: 1; }
.solo-btn:hover { border-color: #58a6ff; color: #58a6ff; }
.solo-btn.active { opacity: 1; background: #58a6ff; border-color: #58a6ff; color: #0d1117; }

.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ticker-info { flex: 1; min-width: 0; }

.ticker-name {
  font-weight: 700;
  color: #e6edf3;
  font-size: 13px;
}

.ticker-sector {
  font-size: 10px;
  color: #6e7681;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.consistency-bar {
  height: 2px;
  background: #21262d;
  border-radius: 1px;
  margin-top: 3px;
  overflow: hidden;
}

.consistency-fill { height: 100%; border-radius: 1px; }

.ticker-meta {
  text-align: right;
  flex-shrink: 0;
  min-width: 64px;
}

.change-pct { font-size: 12px; font-weight: 600; }
.meta-sub { font-size: 10px; color: #6e7681; }

.green { color: #3fb950; }
.red { color: #f85149; }
.gray { color: #6e7681; }

.accel-badge {
  display: inline-block;
  background: #04260f;
  color: #3fb950;
  border: 1px solid #1a7f37;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  padding: 0 5px;
  margin-left: 6px;
  vertical-align: 1px;
}

.stale-tag {
  display: block;
  color: #6e7681;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.02em;
  margin-top: 1px;
}

.empty-msg {
  padding: 40px 20px;
  text-align: center;
  color: #6e7681;
  font-size: 12px;
}

@media (max-width: 640px) {
  body {
    height: auto;
    overflow: auto;
  }

  .header {
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 10px;
  }

  h1 { font-size: 13px; }

  .controls {
    margin-left: 0;
    width: 100%;
    gap: 6px;
    flex-wrap: wrap;
  }

  .mode-btn {
    padding: 5px 8px;
    font-size: 11px;
  }

  .main {
    grid-template-columns: 1fr;
    grid-template-rows: 55vw auto;
    height: auto;
    overflow: visible;
  }

  .chart-area {
    height: 55vw;
    min-height: 220px;
    padding: 8px 8px 6px;
  }

  .sidebar {
    border-left: none;
    border-top: 1px solid #30363d;
    max-height: 50vh;
  }

  .status {
    font-size: 10px;
    bottom: 6px;
    right: 8px;
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>📈 Market Hour Tracker</h1>
  <div class="controls">
    <div class="mode-toggle">
      <button class="mode-btn" id="btnClose" onclick="setMode('close')">Close %</button>
      <button class="mode-btn" id="btnVolume" onclick="setMode('volume')">Volume</button>
      <button class="mode-btn active" id="btnChange" onclick="setMode('change')">Change from Open</button>
      <button class="mode-btn" id="btnRank" onclick="setMode('rank')">Rank</button>
    </div>
    <label>Session</label>
    <select id="sessionSelect" onchange="onSessionChange()"></select>
    <label>Top</label>
    <input type="number" id="topN" value="10" min="1" max="20" onchange="onTopNChange()">
    <label>tickers</label>
    <input type="date" id="dateSelect" onchange="onDateChange()">
    <button class="zoom-btn" id="btnResetZoom" onclick="resetChartZoom()" title="Back to the full session" hidden>⤡ Reset zoom</button>
  </div>
</div>

<div class="main">
  <div class="chart-area">
    <canvas id="chart"></canvas>
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="sidebar">
    <div class="sidebar-head">
      Consistency Rankings
      <select class="sort-select" id="rankSort" onchange="onSortChange()">
        <option value="pct">Consistency %</option>
        <option value="avgRank">Avg Rank</option>
        <option value="latestVol">Latest Vol</option>
        <option value="latestChange" selected>Latest Chg from Open</option>
        <option value="count">Appearances</option>
      </select>
      <button class="show-all-btn" onclick="showAllTickers()">Show All</button>
    </div>
    <div class="ticker-list" id="tickerList"></div>
  </div>
</div>

<script>
const COLORS = [
  '#36A2EB','#FF6384','#FFCE56','#4BC0C0','#9966FF',
  '#FF9F40','#00D4AA','#58A6FF','#F08030','#E74C3C',
  '#2ECC71','#F39C12','#9B59B6','#1ABC9C','#E67E22',
  '#E91E63','#00BCD4','#8BC34A','#FF5722','#607D8B'
];

let chart = null;
let allSnapshots = [];   // full day data from API
let snapshots = [];      // current session's snapshots
let sessions = [];       // array of snapshot arrays, one per detected session
let sessionIdx = 0;      // which session is shown
let hidden = new Set();
let mode = 'change';
let currentDate = '';
let lastCount = 0;
let pollTimer = null;
let rankCache = [];
let rankSort = 'latestChange';
let accelCache = {};

// ── Helpers ──────────────────────────────────────────────────────────────────

// ET, matching how the tracker buckets raw_data_* files. Neither UTC nor the
// browser's local date works: both roll over mid-session for a US market.
const ET_DATE_FMT = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' });
const ET_TIME_FMT = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit'
});

function todayStr() {
  return ET_DATE_FMT.format(new Date()).replace(/-/g, '');
}

function fmtDate(d) {
  return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
}

function fmtVol(v) {
  if (v >= 1e6) return (v/1e6).toFixed(2)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'K';
  return v.toString();
}

function getTopN() {
  return Math.max(1, Math.min(20, parseInt(document.getElementById('topN').value) || 10));
}

// ── Session detection ─────────────────────────────────────────────────────────

// Split snapshots into sessions whenever there's a gap > 60 minutes between them
function detectSessions(snaps) {
  if (!snaps.length) return [];
  const result = [];
  let current = [snaps[0]];
  for (let i = 1; i < snaps.length; i++) {
    const gap = new Date(snaps[i].timestamp) - new Date(snaps[i-1].timestamp);
    if (gap > 60 * 60 * 1000) {
      result.push(current);
      current = [];
    }
    current.push(snaps[i]);
  }
  result.push(current);
  return result;
}

function buildSessionLabel(sess, idx, total) {
  if (!sess.length) return `Session ${idx + 1}`;
  const start = new Date(sess[0].timestamp);
  const end   = new Date(sess[sess.length - 1].timestamp);
  const fmt = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const label = `${fmt(start)} – ${fmt(end)} (${sess.length} snaps)`;
  // Most recent session last in the array = "current"
  return (idx === total - 1) ? `Current: ${label}` : `Prev: ${label}`;
}

// Options are reconciled rather than re-written: the labels carry a live
// snapshot count, so rebuilding innerHTML on every poll closed the dropdown
// under the user each time a new snapshot landed.
function populateSessionSelect() {
  const sel = document.getElementById('sessionSelect');
  while (sel.options.length > sessions.length) sel.remove(sel.options.length - 1);
  sessions.forEach((s, i) => {
    let opt = sel.options[i];
    if (!opt) {
      opt = document.createElement('option');
      opt.value = String(i);
      sel.appendChild(opt);
    }
    const label = buildSessionLabel(s, i, sessions.length);
    if (opt.textContent !== label) opt.textContent = label;
  });
  if (sel.value !== String(sessionIdx)) sel.value = String(sessionIdx);
}

function applySession() {
  snapshots = sessions[sessionIdx] || [];
  rankCache = calcConsistency(snapshots);
  accelCache = calcAccel(snapshots);
  sortRankCache();
  resetHidden();
  rebuild();
  renderSidebar();
}

// ── API ───────────────────────────────────────────────────────────────────────

async function apiFetch(url) {
  const r = await fetch(url);
  return r.json();
}

// TradingView's change_from_open/close are ~15min delayed for this account
// (see volume_momentum_tracker.py); alpaca_change_from_open/alpaca_price are
// computed live from Alpaca quotes each scan, so prefer them whenever present.
function pmChange(item) {
  return typeof item.alpaca_change_from_open === 'number' ? item.alpaca_change_from_open : item.change_from_open;
}

function pmPrice(item) {
  return typeof item.alpaca_price === 'number' ? item.alpaca_price : item.close;
}

// Same story for volume: TradingView's `volume` is the delayed cumulative
// figure, and in the first 15 minutes of the session it is still yesterday's
// *final* total (DFNS showed a frozen 78.86M on 2026-07-28 while Alpaca had
// 11.4M). Reading it raw made "Vol % of total" jump around purely because the
// denominator collapsed when the feed rolled over, so prefer Alpaca here too.
function pmVolume(item) {
  return typeof item.alpaca_volume === 'number' ? item.alpaca_volume : (item.volume || 0);
}

function numOr(v, fallback) {
  return typeof v === 'number' && isFinite(v) ? v : fallback;
}

// ── Acceleration (sudden incline) detection ─────────────────────────────────
// Compares the ticker's last two change-from-open readings against the pair
// before that. If the most recent jump is much bigger than the previous one
// (or the previous move was flat/falling and this one isn't), the move just
// went from a gentle slope to an obvious incline — flag it. Recomputed from
// scratch whenever the session's data is recalculated, so the mark only shows
// while the *latest* reading is the one driving it.
const ACCEL_MIN_JUMP = 1.5;   // minimum pp jump between the last two readings
const ACCEL_FACTOR = 2.5;     // latest jump must be this many times the prior jump

function calcAccel(snaps) {
  const series = {};
  snaps.forEach((snap, si) => {
    snap.data.forEach(item => {
      const chg = pmChange(item);
      if (typeof chg !== 'number') return;
      (series[item.name] = series[item.name] || []).push({ si, chg });
    });
  });

  const accel = {};
  for (const [name, obs] of Object.entries(series)) {
    if (obs.length < 3) continue;
    const [a, b, c] = obs.slice(-3);
    const prevDiff = b.chg - a.chg;
    const lastDiff = c.chg - b.chg;
    if (lastDiff < ACCEL_MIN_JUMP) continue;
    const isAccel = prevDiff <= 0 ? true : lastDiff >= prevDiff * ACCEL_FACTOR;
    if (isAccel) accel[name] = { si: c.si, lastDiff, prevDiff };
  }
  return accel;
}

// ── Consistency calc ──────────────────────────────────────────────────────────

function calcConsistency(snaps) {
  if (!snaps.length) return [];
  const total = snaps.length;
  const map = {};

  // Track all close values seen per ticker to detect frozen prices
  const closeValues = {};

  snaps.forEach((snap, si) => {
    snap.data.forEach((item, i) => {
      const n = item.name;
      if (!map[n]) {
        map[n] = {
          name: n,
          sector: item.sector || '',
          exchange: item.exchange || '',
          count: 0,
          rankSum: 0,
          maxVol: 0,
          latestVol: 0,
          latestChange: null,
          latestClose: 0,
          latestRank: null,
          latestSnap: null
        };
        closeValues[n] = new Set();
      }
      map[n].count++;
      map[n].rankSum += (i + 1);
      const v = pmVolume(item);
      if (v > map[n].maxVol) map[n].maxVol = v;
      const p = pmPrice(item);
      if (p > 0) closeValues[n].add(p);

      // "Latest" means last *seen*, not "present in the final snapshot".
      // Keying off the final snapshot left every ticker that had already
      // dropped out reading 0.00%, which sorted them all to the bottom of
      // "Latest Chg from Open" as if they were flat rather than stale.
      map[n].latestVol = v;
      map[n].latestChange = pmChange(item);
      map[n].latestClose = p;
      map[n].latestRank = i + 1;
      map[n].latestSnap = si;
    });
  });

  // Only include tickers with at least 2 snaps AND whose close price actually moved
  // (frozen = same close across all appearances — stale screener data)
  const minSnaps = Math.min(3, total);
  return Object.values(map)
    .filter(t => t.count >= minSnaps && (closeValues[t.name] || new Set()).size > 1)
    .map(t => ({
      ...t,
      avgRank: t.rankSum / t.count,
      pct: t.count / total
    }));
}

function sortRankCache() {
  rankCache.sort((a, b) => {
    switch (rankSort) {
      case 'avgRank':      return a.avgRank - b.avgRank;
      case 'latestVol':    return b.latestVol - a.latestVol;
      // latestChange is null when the ticker never reported a usable reading;
      // sort those to the bottom instead of letting null coerce to 0.
      case 'latestChange': return (numOr(b.latestChange, -Infinity)) - (numOr(a.latestChange, -Infinity));
      case 'count':        return b.count - a.count;
      default:             return b.pct - a.pct || a.avgRank - b.avgRank;
    }
  });
}

// ── Persisted manual hide/show overrides ────────────────────────────────────
// Clicking a ticker to hide/show it is a manual override on top of the
// topN-based default. Persisted per trading date so it survives the page's
// auto-refresh but doesn't bleed into the next trading day.
function hiddenStorageKey() {
  return `markethour_hidden_${currentDate}`;
}

function loadHiddenOverrides() {
  try {
    const raw = localStorage.getItem(hiddenStorageKey());
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function setHiddenOverride(name, isHidden) {
  try {
    const overrides = loadHiddenOverrides();
    overrides[name] = isHidden;
    localStorage.setItem(hiddenStorageKey(), JSON.stringify(overrides));
  } catch (e) {}
}

function clearHiddenOverrides() {
  try { localStorage.removeItem(hiddenStorageKey()); } catch (e) {}
}

function applyHiddenOverrides() {
  const overrides = loadHiddenOverrides();
  Object.entries(overrides).forEach(([name, isHidden]) => {
    if (isHidden) hidden.add(name);
    else hidden.delete(name);
  });
}

function resetHidden() {
  const topN = getTopN();
  hidden.clear();
  rankCache.forEach((t, i) => {
    if (i >= topN) hidden.add(t.name);
  });
  applyHiddenOverrides();
  knownTickers = new Set(rankCache.map(t => t.name));
  soloedName = null;
  preSoloHidden = null;
}

// Tickers we've already decided a visibility for. Anything the screener turns up
// later has no entry in `hidden`, which used to mean it appeared on the chart
// unasked — even mid-solo, where a stray line broke the isolation the user set
// up. New arrivals get the same default a fresh load would have given them.
let knownTickers = new Set();

function classifyNewTickers() {
  const topN = getTopN();
  const overrides = loadHiddenOverrides();
  rankCache.forEach((t, i) => {
    if (knownTickers.has(t.name)) return;
    knownTickers.add(t.name);
    const shouldHide = typeof overrides[t.name] === 'boolean' ? overrides[t.name] : i >= topN;
    // While soloing, the decision applies to the state we'll restore on un-solo;
    // the live hidden-set stays "everything but the soloed ticker".
    const target = soloedName ? preSoloHidden : hidden;
    if (target) {
      if (shouldHide) target.add(t.name);
      else target.delete(t.name);
    }
    if (soloedName) hidden.add(t.name);
  });
}

// ── Chart ─────────────────────────────────────────────────────────────────────

function snapVolTotals() {
  return snapshots.map(snap => snap.data.reduce((s, d) => s + pmVolume(d), 0));
}

// First known close for a ticker, for close-mode normalization
function firstCloseFor(name) {
  for (const snap of snapshots) {
    const entry = snap.data.find(d => d.name === name);
    if (entry) {
      const p = pmPrice(entry);
      if (p > 0) return p;
    }
  }
  return null;
}

function tickerDataset(t, color, snapTotals) {
  const base = mode === 'close' ? firstCloseFor(t.name) : null;
  const data = snapshots.map(snap => {
    const idx = snap.data.findIndex(d => d.name === t.name);
    if (idx === -1) return { x: snap.timestamp, y: null };
    const entry = snap.data[idx];
    let y;
    if (mode === 'close')   y = base ? (pmPrice(entry) - base) / base * 100 : null;
    else if (mode === 'volume') y = pmVolume(entry);
    else if (mode === 'change') y = pmChange(entry);
    else y = idx + 1; // rank
    return { x: snap.timestamp, y };
  });
  const pointRadii = snapshots.map((snap, si) => {
    const idx = snap.data.findIndex(d => d.name === t.name);
    if (idx === -1) return 2;
    const total = snapTotals[si];
    if (!total) return 2;
    const volPct = pmVolume(snap.data[idx]) / total * 100;
    return Math.max(2, Math.min(9, 2 + Math.sqrt(volPct) * 1.8));
  });
  return {
    label: t.name,
    data,
    borderColor: color,
    backgroundColor: color + '18',
    borderWidth: 1.8,
    pointRadius: pointRadii,
    pointHoverRadius: 7,
    tension: 0.25,
    spanGaps: false,
    hidden: false
  };
}

function buildDatasets() {
  const shown = rankCache.filter(t => !hidden.has(t.name));
  const snapTotals = snapVolTotals();
  return shown.map((t, i) => tickerDataset(t, COLORS[i % COLORS.length], snapTotals));
}

function yAxisConfig() {
  if (mode === 'close') {
    return {
      type: 'linear',
      title: { display: true, text: 'Close % from session start', color: '#6e7681', font: { size: 11 } },
      grid: { color: '#1c2128' },
      ticks: { color: '#6e7681', font: { size: 11 }, callback: v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%' }
    };
  }
  if (mode === 'volume') {
    return {
      type: 'logarithmic',
      title: { display: true, text: 'Volume', color: '#6e7681', font: { size: 11 } },
      grid: { color: '#1c2128' },
      ticks: { color: '#6e7681', font: { size: 11 }, callback: v => fmtVol(v) }
    };
  }
  if (mode === 'change') {
    return {
      type: 'linear',
      title: { display: true, text: 'Change from Open (%)', color: '#6e7681', font: { size: 11 } },
      grid: { color: '#1c2128' },
      ticks: {
        color: '#6e7681',
        font: { size: 11 },
        callback: v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%'
      }
    };
  }
  return {
    type: 'linear',
    reverse: true,
    min: 1,
    max: 20,
    title: { display: true, text: 'Rank (1 = top momentum)', color: '#6e7681', font: { size: 11 } },
    grid: { color: '#1c2128' },
    ticks: {
      color: '#6e7681',
      font: { size: 11 },
      stepSize: 1,
      callback: v => Number.isInteger(v) ? `#${v}` : ''
    }
  };
}

// The chart instance is created once and then mutated in place. Tearing it down
// and rebuilding on every 30s poll threw away everything the user had on screen
// — the hovered/soloed ticker, an open tooltip, the in-flight animation — so the
// only thing that still forces a fresh instance is a mode switch, which changes
// the y-axis type and is a deliberate click anyway.
let chartMode = null;   // the mode the live chart instance was built for

function createChart() {
  if (chart) { chart.destroy(); chart = null; }

  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: { datasets: buildDatasets() },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 250 },
      interaction: { mode: 'nearest', intersect: true },
      onClick: (event, elements) => {
        if (!elements.length) return;
        const ticker = chart.data.datasets[elements[0].datasetIndex].label;
        window.open(`https://www.tradingview.com/chart/?symbol=${encodeURIComponent(ticker)}`, '_blank');
      },
      plugins: {
        legend: { display: false },
        // Wheel/pinch zooms, plain drag pans, shift+drag rubber-bands a region.
        // The plugin refuses to pan while the drag modifier is held, so the two
        // never fight, and it swallows the click that ends a drag/pan so those
        // gestures don't fall through to the open-in-TradingView handler.
        // No `limits` on purpose: the data keeps growing, and clamping to the
        // range as it stood when you zoomed would trap you behind new snapshots.
        zoom: {
          pan: { enabled: true, mode: 'xy', threshold: 10, onPanComplete: syncZoomBtn },
          zoom: {
            wheel: { enabled: true, speed: 0.08 },
            pinch: { enabled: true },
            drag: {
              enabled: true,
              modifierKey: 'shift',
              backgroundColor: 'rgba(88,166,255,0.15)',
              borderColor: '#58a6ff',
              borderWidth: 1
            },
            mode: 'xy',
            onZoomComplete: syncZoomBtn
          }
        },
        tooltip: {
          backgroundColor: '#161b22',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#58a6ff',
          bodyColor: '#c9d1d9',
          padding: 12,
          displayColors: false,
          callbacks: {
            title: items => {
              if (!items.length) return '';
              const item = items[0];
              const ticker = item.dataset.label;
              const time = new Date(item.raw.x).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              return `${ticker}  ·  ${time}`;
            },
            label: item => {
              const snap = snapshots[item.dataIndex];
              if (!snap) return [];
              const ticker = item.dataset.label;
              const entry = snap.data.find(d => d.name === ticker);
              if (!entry) return [];
              const rank = snap.data.indexOf(entry) + 1;
              const vol = pmVolume(entry);
              const totalVol = snap.data.reduce((s, d) => s + pmVolume(d), 0);
              const pct = totalVol > 0 ? (vol / totalVol * 100).toFixed(2) : '—';
              const chg = numOr(pmChange(entry), null);
              const chgStr = chg === null ? '—' : (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
              return [
                ` Close   : $${pmPrice(entry).toFixed(4)}`,
                ` Volume  : ${fmtVol(vol)} (${vol.toLocaleString()})`,
                ` Vol %   : ${pct}% of total`,
                ` Chg/Open: ${chgStr}`,
                ` Rank    : #${rank}`,
                ` Sector  : ${entry.sector || '—'}`,
              ];
            }
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: {
            tooltipFormat: 'HH:mm',
            displayFormats: { minute: 'HH:mm', hour: 'HH:mm' }
          },
          grid: { color: '#1c2128' },
          ticks: { color: '#6e7681', font: { size: 11 }, maxTicksLimit: 12 }
        },
        y: yAxisConfig()
      }
    }
  });
  chartMode = mode;
}

function rebuild() {
  if (!snapshots.length) return;
  if (!chart || chartMode !== mode) {
    createChart();
  } else {
    chart.data.datasets = buildDatasets();
    // Mid hover-solo, applyHoverSolo() re-hides the other lines immediately
    // below — animating them in first just to hide them reads as a flash.
    chart.update(hoverSoloName ? 'none' : undefined);
  }
  applyHoverSolo();
  syncZoomBtn();
}

// ── Zoom ──────────────────────────────────────────────────────────────────────
// The plugin writes the zoomed min/max straight into the chart's scale config,
// so a zoom survives the in-place chart.update() the poll does — new snapshots
// stream in underneath without yanking the view back to the full session.

function resetChartZoom() {
  if (chart && chart.resetZoom) chart.resetZoom();
  syncZoomBtn();
}

// Guarded on the plugin's own methods so a CDN hiccup degrades to "no zoom"
// rather than taking the rest of the page down with it.
function syncZoomBtn() {
  const btn = document.getElementById('btnResetZoom');
  if (btn) btn.hidden = !chart || !chart.isZoomedOrPanned || !chart.isZoomedOrPanned();
}

// ── Sidebar ───────────────────────────────────────────────────────────────────

// Rows are reconciled by ticker name rather than re-written wholesale with
// innerHTML. A poll used to replace every row, which reset the list's scroll
// position and silently dropped the row the cursor was sitting on (its
// mouseleave never fired, so hover-solo got stuck on a dead element).
const rowEls = new Map();   // ticker name → its <div class="ticker-row">

function rowInnerHTML(t, color, maxCount) {
  const chg = numOr(t.latestChange, null);
  const chgClass = chg === null ? 'gray' : chg > 0 ? 'green' : chg < 0 ? 'red' : 'gray';
  const chgStr = chg === null
    ? '—'
    : (chg > 0 ? '+' : '') + chg.toFixed(2) + '%';
  // The reading is the ticker's last *seen* value; if that wasn't the most
  // recent snapshot, mark it so a stale number can't pass for a live one.
  const isStale = t.latestSnap !== null && t.latestSnap < snapshots.length - 1;
  const staleTag = isStale
    ? `<span class="stale-tag" title="Last seen ${snapshots.length - 1 - t.latestSnap} snapshot(s) ago at ${new Date(snapshots[t.latestSnap].timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}">last seen</span>`
    : '';
  const barWidth = ((t.count / maxCount) * 100).toFixed(1);
  const accel = accelCache[t.name];
  const accelBadge = accel ? `<span class="accel-badge" title="Accelerating: latest move +${accel.lastDiff.toFixed(2)}pp vs +${accel.prevDiff.toFixed(2)}pp before">🚀 surge</span>` : '';

  return `
      <div class="dot" style="background:${color}"></div>
      <div class="ticker-info">
        <div class="ticker-name">${t.name}${accelBadge}</div>
        <div class="ticker-sector">${t.sector}</div>
        <div class="consistency-bar">
          <div class="consistency-fill" style="width:${barWidth}%;background:${color}"></div>
        </div>
      </div>
      <div class="ticker-meta">
        <div class="change-pct ${chgClass}">${chgStr}${staleTag}</div>
        <div class="meta-sub">${t.count}/${snapshots.length} snaps</div>
        <div class="meta-sub">avg #${t.avgRank.toFixed(1)}</div>
      </div>
      <button class="solo-btn${t.name === soloedName ? ' active' : ''}" title="Show only this ticker" onclick="soloTicker(event, '${t.name}')">1</button>`;
}

function renderSidebar() {
  const list = document.getElementById('tickerList');

  if (!rankCache.length) {
    list.innerHTML = '<div class="empty-msg">No data for this date.</div>';
    rowEls.clear();
    return;
  }
  if (!rowEls.size) list.innerHTML = '';   // drop the "no data" placeholder

  const maxCount = rankCache[0]?.count || 1;

  // Build color map: assign colors in order of visible tickers
  const colorMap = {};
  let colorIdx = 0;
  rankCache.forEach(t => {
    if (!hidden.has(t.name)) colorMap[t.name] = COLORS[colorIdx++ % COLORS.length];
  });

  const order = rankCache.map(t => {
    let el = rowEls.get(t.name);
    if (!el) {
      el = document.createElement('div');
      el.addEventListener('click', () => toggleTicker(t.name));
      el.addEventListener('mouseenter', () => hoverSolo(t.name));
      el.addEventListener('mouseleave', () => hoverSoloEnd());
      rowEls.set(t.name, el);
    }
    const inChart = !hidden.has(t.name);
    const cls = 'ticker-row' + (inChart ? '' : ' muted');
    if (el.className !== cls) el.className = cls;
    const html = rowInnerHTML(t, inChart ? colorMap[t.name] : '#444', maxCount);
    // Only touch the DOM when the row's contents actually changed, so a poll
    // that moves one ticker leaves the other rows (and their :hover) alone.
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
    return el;
  });

  rowEls.forEach((el, name) => {
    if (!order.includes(el)) { el.remove(); rowEls.delete(name); }
  });

  // Re-seat only the rows whose position changed; the rest keep their nodes.
  order.forEach((el, i) => {
    if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
  });
}

// ── Status bar ────────────────────────────────────────────────────────────────

function updateStatus() {
  const el = document.getElementById('status');
  const now = ET_TIME_FMT.format(new Date());
  const isToday = currentDate === todayStr();
  const dot = isToday ? '<span class="live-dot"></span>' : '';
  el.innerHTML = `${dot}${isToday ? 'Live · ' : ''}Updated ${now} ET · ${snapshots.length} snaps (session ${sessionIdx + 1}/${sessions.length})`;
}

// ── Polling ───────────────────────────────────────────────────────────────────

function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    const today = todayStr();
    if (currentDate !== today) return;
    const res = await apiFetch(`/markethour/api/latest?date=${today}`);
    if (res.count > lastCount) {
      lastCount = res.count;
      const data = await apiFetch(`/markethour/api/data?date=${today}`);
      allSnapshots = data;
      const newSessions = detectSessions(allSnapshots);
      const switched = newSessions.length !== sessions.length;
      sessions = newSessions;
      if (switched) {
        // A new session began — that's a genuinely different view, so start it
        // from the topN default rather than carrying the old one's selection.
        sessionIdx = sessions.length - 1;
        populateSessionSelect();
        applySession();
      } else {
        populateSessionSelect();
        snapshots = sessions[sessionIdx] || [];
        rankCache = calcConsistency(snapshots);
        accelCache = calcAccel(snapshots);
        sortRankCache();
        classifyNewTickers();
        rebuild();
        renderSidebar();
      }
    }
    updateStatus();
  }, 30000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ── Event handlers ────────────────────────────────────────────────────────────

function toggleTicker(name) {
  // A plain row click while soloed breaks the solo's all-but-one invariant,
  // so forget the solo toggle rather than let it restore a stale snapshot.
  soloedName = null;
  preSoloHidden = null;
  if (hidden.has(name)) hidden.delete(name);
  else hidden.add(name);
  setHiddenOverride(name, hidden.has(name));
  rebuild();
  renderSidebar();
}

// Soloing is a toggle: first click isolates the ticker, remembering the
// hidden-set as it stood beforehand; clicking the same ticker's solo button
// again restores exactly that prior state (not "show everything").
let soloedName = null;
let preSoloHidden = null;

function soloTicker(evt, name) {
  evt.stopPropagation();
  if (soloedName === name) {
    hidden = new Set(preSoloHidden);
    soloedName = null;
    preSoloHidden = null;
  } else {
    if (soloedName === null) preSoloHidden = new Set(hidden);
    hidden.clear();
    rankCache.forEach(t => { if (t.name !== name) hidden.add(t.name); });
    soloedName = name;
  }
  rebuild();
  renderSidebar();
}

// Hover-solo: temporarily isolate one ticker's line while the cursor is on its
// sidebar row, without touching the persistent hidden-set state.
let hoverSoloName = null;

function hoverSolo(name) {
  hoverSoloName = name;
  applyHoverSolo();
}

function applyHoverSolo() {
  // A poll can drop the ticker being hovered out of the rankings entirely; its
  // row disappears without ever firing mouseleave, so let go of it here rather
  // than leave every dataset hidden behind a ticker that no longer exists.
  if (hoverSoloName && !rankCache.some(r => r.name === hoverSoloName)) hoverSoloName = null;
  if (!chart || !hoverSoloName) return;
  chart.data.datasets = chart.data.datasets.filter(ds => !ds._hoverTemp);
  const inChart = chart.data.datasets.some(ds => ds.label === hoverSoloName);
  if (!inChart) {
    // Muted ticker: build a temporary dataset so it can be previewed
    const t = rankCache.find(r => r.name === hoverSoloName);
    if (t) {
      const ds = tickerDataset(t, '#58a6ff', snapVolTotals());
      ds._hoverTemp = true;
      chart.data.datasets.push(ds);
    }
  }
  chart.data.datasets.forEach(ds => {
    ds.hidden = ds.label !== hoverSoloName;
  });
  chart.update('none');
}

function hoverSoloEnd() {
  hoverSoloName = null;
  if (!chart) return;
  chart.data.datasets = chart.data.datasets.filter(ds => !ds._hoverTemp);
  chart.data.datasets.forEach(ds => { ds.hidden = false; });
  chart.update('none');
}

function showAllTickers() {
  hidden.clear();
  clearHiddenOverrides();
  soloedName = null;
  preSoloHidden = null;
  rebuild();
  renderSidebar();
}

function onSessionChange() {
  sessionIdx = parseInt(document.getElementById('sessionSelect').value);
  applySession();
  updateStatus();
}

function onTopNChange() {
  resetHidden();
  rebuild();
  renderSidebar();
}

function onSortChange() {
  rankSort = document.getElementById('rankSort').value;
  sortRankCache();
  resetHidden();
  rebuild();
  renderSidebar();
}

function setMode(m) {
  mode = m;
  document.getElementById('btnClose').classList.toggle('active', m === 'close');
  document.getElementById('btnVolume').classList.toggle('active', m === 'volume');
  document.getElementById('btnChange').classList.toggle('active', m === 'change');
  document.getElementById('btnRank').classList.toggle('active', m === 'rank');
  rebuild();
}

async function onDateChange() {
  currentDate = document.getElementById('dateSelect').value.replace(/-/g, '');
  const data = await apiFetch(`/markethour/api/data?date=${currentDate}`);
  allSnapshots = data;
  lastCount = data.length;
  sessions = detectSessions(allSnapshots);
  sessionIdx = sessions.length - 1; // default to most recent session
  populateSessionSelect();
  applySession();
  updateStatus();
  stopPolling();
  if (currentDate === todayStr()) startPolling();
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  const dates = await apiFetch('/markethour/api/dates');
  const today = todayStr();
  const sel = document.getElementById('dateSelect');

  if (dates.length) {
    sel.min = fmtDate(dates[dates.length - 1]);
    sel.max = fmtDate(dates[0]);
  }

  currentDate = dates.includes(today) ? today : (dates[0] || today);
  sel.value = fmtDate(currentDate);

  const data = await apiFetch(`/markethour/api/data?date=${currentDate}`);
  allSnapshots = data;
  lastCount = data.length;
  sessions = detectSessions(allSnapshots);
  sessionIdx = sessions.length - 1;
  populateSessionSelect();
  applySession();
  updateStatus();

  // No periodic location.reload() here: the 30s poll already folds new
  // snapshots into the live chart, and reloading threw away the user's
  // selection/zoom mid-session for no gain.
  if (currentDate === today) startPolling();
}

init();
</script>
</body>
</html>
